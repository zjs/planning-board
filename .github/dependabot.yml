# Weekly dependency updates (questions.md Q49). Minor and patch updates come
# grouped, one pull request per ecosystem; a major version comes on its own,
# since it may need work. Each pull request goes through CI and self-review
# like any other (docs/housekeeping.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript only below 6.1 for now (docs/backlog.md, Housekeeping).
      - dependency-name: typescript
        versions: ['>= 6.1']

  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
