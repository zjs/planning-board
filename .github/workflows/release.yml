name: Release the relay

# After CI passes on main: the relay's downloads and its container image, built
# from what that CI run already built and tested, never rebuilt here
# (questions.md Q69).
#
# - Every merge replaces the rolling relay-latest release and the image's
#   latest tag.
# - A merge that sets a new version in package.json also publishes that
#   version: release vX.Y.Z with the notes in docs/releases/vX.Y.Z.md, and the
#   image tag X.Y.Z (ADR 0023).
# - Every download has a checksum in SHA256SUMS and a build attestation, so
#   anyone can check it came from this workflow (`gh attestation verify`).
#
# Third-party actions are pinned to commits; Dependabot keeps them current.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-relay
  cancel-in-progress: false

jobs:
  # Which version main is at, and whether it's new: no tag for it yet.
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.0 ] || [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Version $version: nothing new to release."
          else
            # The notes test in npm run check should have caught this already.
            test -s "docs/releases/v$version.md" || { echo "docs/releases/v$version.md is missing"; exit 1; }
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Version $version is new: releasing v$version."
          fi

  downloads:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: docs/releases

      - name: Fetch the downloads CI built
        uses: actions/download-artifact@v8
        with:
          pattern: planning-board-relay-*.tar.gz
          path: downloads
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # download-artifact unpacks an artifact that is itself a zip, so Windows' download arrives as its folder.
      - name: Fetch the Windows download CI built
        uses: actions/download-artifact@v8
        with:
          name: planning-board-relay-windows-amd64.zip
          path: windows
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Zip the Windows download again
        run: |
          ls -laR windows
          if [ -f windows/planning-board-relay-windows-amd64.zip ]; then
            mv windows/planning-board-relay-windows-amd64.zip downloads/
          else
            (cd windows && zip -qr ../downloads/planning-board-relay-windows-amd64.zip planning-board-relay)
          fi
          test "$(ls downloads | wc -l)" -eq 5

      - name: Checksums
        run: |
          (cd downloads && sha256sum planning-board-relay-* > SHA256SUMS)
          cat downloads/SHA256SUMS

      - name: Attest where each download came from
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: downloads/planning-board-relay-*

      - name: Replace the relay-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ls -la downloads
          gh release delete relay-latest --yes --cleanup-tag || true
          gh release create relay-latest downloads/* \
            --prerelease \
            --latest=false \
            --target "$SHA" \
            --title "Relay (latest main)" \
            --notes "The Planning Board relay, with the app inside, built from ${SHA}. It's rebuilt from every change to main, so this is always the newest; for a version to pin, take the latest numbered release. Download the archive for your computer, unpack it, and run planning-board-relay. Check a download with SHA256SUMS or gh attestation verify. Mac, Windows and container steps: https://github.com/zjs/planning-board/blob/main/relay/README.md. Running it for a team: https://github.com/zjs/planning-board/blob/main/docs/hosting.md."

      - name: Publish the new version
        if: needs.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already published."
            exit 0
          fi
          gh release create "v$VERSION" downloads/* \
            --latest \
            --target "$SHA" \
            --title "Planning Board $VERSION" \
            --notes-file "docs/releases/v$VERSION.md"

  container:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch the Linux binaries CI built
        uses: actions/download-artifact@v8
        with:
          pattern: planning-board-relay-linux-*
          path: relay
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare the image's files
        run: |
          mkdir -p relay/data
          ls -la relay

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Name the image
        id: names
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          NEW: ${{ needs.version.outputs.new }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${REPO,,}"
          tags="${image}:latest,${image}:sha-${SHA::12}"
          if [ "$NEW" = true ]; then tags="${tags},${image}:${VERSION}"; fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: relay
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}

      - name: Attest where the image came from
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
