name: Pages

# Publishes the latest main as a hosted page, so anyone can try the app
# without a GitHub login (questions.md Q5, Q31). It's the very file the CI run
# built and tested, never rebuilt here. Needs Settings › Pages › Source:
# GitHub Actions. To redeploy, re-run the latest Pages run: an older one would
# publish an older build, and CI keeps its artifacts for 90 days.

# What the address serves (Q80 d, ADR 0025) is set by the repository variable
# OLD_ADDRESS_SERVES, in Settings › Secrets and variables › Actions:
# - unset or `app`: the app, with move.html beside it, which hands this
#   address's plans to the public build's new one when someone asks there;
# - `stub`: once the new address is live and checked (docs/domain-move.md),
#   stub.html in the app's place, move.html, and the old app at ./app/, so
#   people can still save their plans to files.

# Only after CI passes on main, so a red build never reaches the public page.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer main waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fetch the app the CI run built and tested
        uses: actions/download-artifact@v8
        with:
          name: planning-board-${{ github.event.workflow_run.head_sha }}.html
          path: app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Fetch the old address's pages
        uses: actions/download-artifact@v8
        with:
          name: old-address-pages-${{ github.event.workflow_run.head_sha }}
          path: pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Lay it out as the site
        env:
          SERVES: ${{ vars.OLD_ADDRESS_SERVES || 'app' }}
        run: |
          mkdir site
          cp pages/move.html site/move.html
          case "$SERVES" in
            app) cp app/*.html site/index.html ;;
            stub)
              cp pages/stub.html site/index.html
              mkdir site/app
              cp app/*.html site/app/index.html ;;
            *) echo "OLD_ADDRESS_SERVES is '$SERVES': it must be app or stub."; exit 1 ;;
          esac
          test -s site/index.html && test -s site/move.html
          ls -laR site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
