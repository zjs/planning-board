name: Pages

# Publishes the latest main as a hosted page, so anyone can try the app
# without a GitHub login (questions.md Q5, Q31). It's the very file the CI run
# built and tested, never rebuilt here. Needs Settings › Pages › Source:
# GitHub Actions. To redeploy, re-run a Pages run.

# Only after CI passes on main, so a red build never reaches the public page.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer main waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fetch the app the CI run built and tested
        uses: actions/download-artifact@v8
        with:
          name: planning-board-${{ github.event.workflow_run.head_sha }}.html
          path: app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Lay it out as the site
        run: |
          mkdir site
          cp app/*.html site/index.html
          test -s site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
