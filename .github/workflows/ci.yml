name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Pull requests from forks get a read-only token and no secrets either way.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit keeps its build artifact; superseded branch pushes are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Check names are what the main ruleset requires: renaming a job means updating the ruleset in the same breath.
jobs:
  check:
    name: 'App: typecheck, lint, tests, build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      # Each check runs whatever failed before it, so one red run names every problem.
      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        id: unit
        if: ${{ !cancelled() }}
        run: npm test -- --reporter=default --reporter=json --outputFile.json=reports/unit.json

      - name: Build single-file app
        id: build
        if: ${{ !cancelled() }}
        run: npm run build
        env:
          # The commit the build names in its help panel. On a pull request, the branch's head, not GitHub's merge commit.
          VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Chromium for end-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # An install takes under a minute, but an Ubuntu mirror that stops answering hangs apt until the job
        # times out (2026-10-07). Short apt timeouts let it move on to the next mirror. A stalled attempt is
        # retried, after stopping the apt-get it leaves behind, which otherwise holds the dpkg lock.
        timeout-minutes: 10
        run: |
          echo 'Acquire::http::Timeout "20"; Acquire::https::Timeout "20"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          for attempt in 1 2 3; do
            timeout 180 npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed or stalled; retrying."
            sudo pkill -x apt-get || true
            for _ in $(seq 30); do sudo fuser /var/lib/dpkg/lock-frontend > /dev/null 2>&1 || break; sleep 2; done
            sudo dpkg --configure -a || true
          done
          exit 1

      # The sharing tests (e2e/relay/) run against a real relay, which Playwright starts with `go run`.
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          go-version: '1.27.x'
          cache-dependency-path: relay/go.sum

      - name: End-to-end tests (dist/index.html over file://, and served by a relay)
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run e2e

      # Named for its commit, and uploaded unzipped, so the download is the app itself: open it in a browser.
      - name: Name the build for its commit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cp dist/index.html "planning-board-${BUILD_COMMIT}.html"

      - name: Attach build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: planning-board-${{ github.event.pull_request.head.sha || github.sha }}.html
          archive: false
          if-no-files-found: error

      # Every step, how it went, the test counts, and the build to download (scripts/ci-summary.ts).
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          STEP_TYPECHECK: ${{ steps.typecheck.outcome }}
          STEP_LINT: ${{ steps.lint.outcome }}
          STEP_UNIT: ${{ steps.unit.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_E2E: ${{ steps.e2e.outcome }}
        run: node scripts/ci-summary.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Playwright report
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # The relay (ADR 0017): Go, in relay/. Its tests run beside the web checks.
  relay-test:
    name: 'Relay: format, vet, tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: relay/go.sum

      - name: Formatting
        id: fmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        id: vet
        if: ${{ !cancelled() }}
        run: go vet ./...

      - name: Tests
        id: test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          go test -race -v ./... 2>&1 | tee ../relay-tests.log

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          STEP_FMT: ${{ steps.fmt.outcome }}
          STEP_VET: ${{ steps.vet.outcome }}
          STEP_TEST: ${{ steps.test.outcome }}
        run: |
          mark() { case "$1" in success) echo '✅';; failure) echo '❌';; *) echo '⏭️';; esac; }
          passed=$(grep -c -- '--- PASS' ../relay-tests.log || true)
          failed=$(grep -c -- '--- FAIL' ../relay-tests.log || true)
          tests="$passed passed"
          if [ "$failed" -gt 0 ]; then tests="$tests, $failed failed"; fi
          {
            if [ "$STEP_FMT" = success ] && [ "$STEP_VET" = success ] && [ "$STEP_TEST" = success ]; then
              echo '### ✅ Relay: all checks passed'
            else
              echo '### ❌ Relay: a check failed'
            fi
            echo
            echo '| Step | Result |'
            echo '|---|---|'
            echo "| $(mark "$STEP_FMT") Formatting | |"
            echo "| $(mark "$STEP_VET") Vet | |"
            echo "| $(mark "$STEP_TEST") Tests, with the race detector | $tests |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The relay for each computer, with the app built above inside it (Q69). The downloads people use come from
  # the relay-latest release (release.yml); these are attached to every run, like the HTML file.
  relay-build:
    name: Relay download (${{ matrix.target.os }}, ${{ matrix.target.arch }})
    needs: [check, relay-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        target:
          - { os: darwin, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: relay/go.sum

      - name: Fetch the app built by the check job
        uses: actions/download-artifact@v8
        with:
          name: planning-board-${{ github.event.pull_request.head.sha || github.sha }}.html
          path: app

      - name: Build
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
          # The build -version, /config and the cheat sheet name: the same commit the app inside names.
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp app/*.html relay/web/index.html
          exe=planning-board-relay
          if [ "$GOOS" = windows ]; then exe=$exe.exe; fi
          mkdir -p out/planning-board-relay
          build_date=$(git log -1 --format=%cs)
          (cd relay && go build -trimpath -ldflags="-s -w -X main.buildCommit=$BUILD_COMMIT -X main.buildDate=$build_date" -o "../out/planning-board-relay/$exe" .)
          cp relay/README.md out/planning-board-relay/README.md
          cp LICENSE out/planning-board-relay/LICENSE
          # The same notices -licenses prints, as a file beside the program. Run for this computer, not the target.
          (cd relay && GOOS= GOARCH= go run . -licenses) > out/planning-board-relay/THIRD-PARTY-NOTICES.txt
          grep -q '== yjs ' out/planning-board-relay/THIRD-PARTY-NOTICES.txt
          if [ "$GOOS/$GOARCH" = linux/amd64 ]; then
            "out/planning-board-relay/$exe" -version | tee /dev/stderr | grep -q "build ${BUILD_COMMIT::7} ($build_date)"
          fi
          name="planning-board-relay-$GOOS-$GOARCH"
          if [ "$GOOS" = windows ]; then
            (cd out && zip -qr "../$name.zip" planning-board-relay)
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" -C out planning-board-relay
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
          # The bare Linux binaries go into the container image (release.yml).
          if [ "$GOOS" = linux ]; then cp "out/planning-board-relay/$exe" "planning-board-relay-linux-$GOARCH"; fi

      - name: Attach the download
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

      - name: Attach the Linux binary for the container
        if: matrix.target.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: planning-board-relay-linux-${{ matrix.target.arch }}
          path: planning-board-relay-linux-${{ matrix.target.arch }}
          if-no-files-found: error
