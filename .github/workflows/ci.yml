name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Pull requests from forks get a read-only token and no secrets either way.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit keeps its build artifact; superseded branch pushes are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build single-file app
        run: npm run build
        env:
          # The commit the build names in its help panel. On a pull request, the branch's head, not GitHub's merge commit.
          VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Chromium for end-to-end tests
        # An install takes under a minute, but an Ubuntu mirror that stops answering hangs apt until the job
        # times out (2026-10-07). Short apt timeouts let it move on to the next mirror. A stalled attempt is
        # retried, after stopping the apt-get it leaves behind, which otherwise holds the dpkg lock.
        timeout-minutes: 10
        run: |
          echo 'Acquire::http::Timeout "20"; Acquire::https::Timeout "20"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          for attempt in 1 2 3; do
            timeout 180 npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed or stalled; retrying."
            sudo pkill -x apt-get || true
            for _ in $(seq 30); do sudo fuser /var/lib/dpkg/lock-frontend > /dev/null 2>&1 || break; sleep 2; done
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: End-to-end tests (against dist/index.html over file://)
        run: npm run e2e

      # Named for its commit, and uploaded unzipped, so the download is the app itself: open it in a browser.
      - name: Name the build for its commit
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cp dist/index.html "planning-board-${BUILD_COMMIT}.html"

      - name: Attach build
        uses: actions/upload-artifact@v7
        with:
          path: planning-board-${{ github.event.pull_request.head.sha || github.sha }}.html
          archive: false
          if-no-files-found: error

      - name: Build summary
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "### Build ready"
            echo
            echo "Download **planning-board-${BUILD_COMMIT}.html** from the Artifacts section below, and open it in a browser."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
